<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="V.">
  <style>
    /* Monochrome mark: near-black tile in dark mode, near-white in light mode.
       The dot stays orange in both. */
    .tile { fill: #0A0A0A; }
    .mark { stroke: #F5F5F5; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #F5F5F5; }
      .mark { stroke: #0A0A0A; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14"/>
  <path class="mark" d="M15 18 L29.5 46" fill="none" stroke-width="7" stroke-linecap="round"/>
  <path class="mark" d="M44 18 L29.5 46" fill="none" stroke-width="7" stroke-linecap="round"/>
  <circle cx="47" cy="43" r="4.5" fill="#FF8A14"/>
</svg>
